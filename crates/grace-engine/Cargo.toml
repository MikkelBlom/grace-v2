[package]
name = "grace"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aec3 = "0.4.0"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
futures-util = "0.3.34"
grace-audio = { version = "0.0.1", path = "../grace-audio" }
grace-core = { version = "0.0.1", path = "../grace-core" }
grace-llm = { version = "0.0.1", path = "../grace-llm" }
grace-memory = { version = "0.0.1", path = "../grace-memory" }
grace-trace = { version = "0.0.1", path = "../grace-trace" }
grace-vad = { version = "0.0.1", path = "../grace-vad" }
hound = "3.5.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_System_Performance"] }

[lints]
workspace = true
