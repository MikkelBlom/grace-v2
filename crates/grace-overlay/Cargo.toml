[package]
name = "grace-overlay"
description = "Grace's screen-edge glow and focus boxes: a native layered, click-through, topmost window per monitor"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.152"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# The workspace denies unsafe_code; only src/win.rs (the WinAPI layer) allows it, per item.
[lints]
workspace = true
