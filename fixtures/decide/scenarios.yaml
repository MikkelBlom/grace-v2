# Decisions Grace would hand a typed-decision model (Jev-style: noul / choice / score), with the
# right answer. Written by hand for the 4B-vs-9B JevK5 bake-off (2026-10-21); speech-style Danish
# (lowercase, no punctuation) as it arrives from STT. Mikkel is not the test set: these are
# invented lines, a few modelled on failure cases from live run 5.
#
# Each item: id, kind, state (the evidence), q (instructions), type, criteria, expect.
# `en` on a tool item is the same request in English (the model is English-only).

tool_options: &tools
  web_search: Look something up on the internet (news, facts it may not know, opening hours, prices, current events).
  file_search: Find a file or document on Mikkel's computer.
  open_program: Open a program, app or website on the computer.
  reminder: Set a timer or a reminder for later.
  memory: Recall something Mikkel told Grace before (his life, people, preferences).
  none: No tool; just answer or chat.

tool_q: &tool_q Which tool should the assistant use to handle this spoken request from its user Mikkel?

