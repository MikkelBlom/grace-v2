# Grace's tool use end to end (crates/grace-engine/src/bin/grace-tools-sim.rs, ADR 0020).
# Invented Danish lines as STT delivers them (lowercase, no punctuation); several model live
# run 6's failures. Per turn: `tools` that must be called in order ([] = none), `args` regex
# per tool over its JSON arguments, `answer` / `not_answer` regexes over what Grace says.
# Folder counts and files depend on this PC; run the tools server with --dry-run.

- id: s01-fact
  turns:
    - say: hvem spillede sean parker i the social network
      tools: [web_search]
      answer: "(?i)timberlake"
- id: s02-unknown-show
  turns:
    - say: jeg er lige i gang med at se the mentalist sæson tre
      not_answer: "(?i)(don't|do not|didn't) (know|recogni)|sounds intense"
    - say: hvad sker der i afsnit otte
      tools: [web_search]
      args: { web_search: "(?i)mentalist" }
      answer: "(?i)jane|kidnap|ball of fire"
      not_answer: "(?i)sounds (intense|like)|so (he|jane) (actually )?got"
- id: s03-news
  turns:
    - say: fortæl mig en nyhed fra odense fra det sidste døgn
      tools: [web_search]
      args: { web_search: "(?i)news" }
      not_answer: "(?i)couldn't find|could not find|no news|wasn't able"
- id: s04-plot
  turns:
    - say: hvad handler filmen runner runner om
      tools: [web_search]
