      tools: [list_folder]
      args: { list_folder: "(?i)skrivebord|desktop" }
      answer: '(?i)(^|[^0-9])(1[0-9]|sixteen|seventeen|eighteen|nineteen)([^0-9]|$)'
- id: s10-find-and-open
  turns:
    - say: åbn mappen med mine gamle eksamensopgaver i matematik
      tools: [find_files, open_file]
      args: { open_file: "(?i)eksamensopgaver\"" }
      not_answer: "(?i)can't|cannot"
