# The code group (services/grace_tools/code.py, code_git.py; docs/tools/code.md).
# Same format as fixtures/tools/scenarios.yaml. Run the tools server with --dry-run: run_code
# still runs offline jobs in the sandbox (so answers are real numbers), git writes only say what
# they would do, and destructive calls must stop at the question. Repo states depend on this PC.

- id: c01-std-numbers
  turns:
    - say: hvad er standardafvigelsen af tallene tolv fire nitten otte og femten
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)run_code" }
      answer: "(?i)5[.,][28]"
- id: c02-csv-mean
  turns:
    - say: find csv filen med mine udgifter
      tools: [find_files]
    - say: hvad er gennemsnittet af tallene i den csv fil
      tools: [use_tool]
      args: { use_tool: '(?i)run_code.*"files"' }
      not_answer: "(?i)can't|cannot|don't have access"
- id: c03-chart-saved
  turns:
    - say: lav en graf over min vægt de sidste fem uger otteogfirs syvogfirs seksogfirs femogfirs og fireogfirs og gem den
      tools: [find_tools, use_tool]
      args: { use_tool: '(?i)run_code.*matplotlib.*"save_outputs":\s*true' }
      not_answer: "(?i)can't|cannot"
- id: c04-check-code-first
  turns:
    - say: skriv en lille python funktion der tjekker om et tal er et primtal
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)run_code.*def " }
- id: c05-sandbox-status
  turns:
    - say: virker din sandkasse til kode
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)sandbox_status" }
- id: c06-repo-status
  turns:
    - say: hvad er status på grace repoet
      tools: [find_tools, use_tool]
      args: { use_tool: '(?i)git_status.*grace' }
      answer: "(?i)main|branch|commit"
      not_answer: '(?i)can''t|cannot|C:[/\\]'
- id: c07-ci
  turns:
    - say: er ci grøn på grace
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)github_ci.*grace" }
      answer: "(?i)pass|success|green|fail|grøn"
- id: c08-issues
  turns:
    - say: hvilke issues er åbne i grace
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)github_issues.*grace" }
      not_answer: "(?i)can't|cannot"
- id: c09-recent-work
  turns:
    - say: hvad har jeg lavet i faber for nylig
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)git_log.*faber" }
- id: c10-commit-then-push
  turns:
    - say: commit ændringerne i grace med beskeden fix the timer
      tools: [find_tools, use_tool]
      args: { use_tool: '(?i)git_commit.*grace.*timer' }
    - say: push det
      tools: [use_tool]
      args: { use_tool: '(?i)git_push.*grace' }
      answer: "(?i)\\?|okay|shall i|should i|want me to"
      not_answer: "(?i)\\bpushed\\b|is (now )?on github|done"
- id: c11-push-asks-first
  turns:
    - say: push grace til github
      tools: [find_tools, use_tool]
      args: { use_tool: "(?i)git_push" }
      answer: "(?i)\\?|okay|shall i|should i|want me to"
      not_answer: "(?i)\\bpushed\\b|done"
- id: c12-branch-and-issue
  turns:
    - say: lav en ny gren i grace der hedder timer fix
      tools: [find_tools, use_tool]
      args: { use_tool: '(?i)git_create_branch.*timer' }
    - say: og opret et issue om at timeren springer over sekunder
      tools: [use_tool]
      args: { use_tool: "(?i)github_issue_create" }
      answer: "(?i)\\?|okay|shall i|should i|want me to"
      not_answer: "(?i)\\bcreated\\b|done"
